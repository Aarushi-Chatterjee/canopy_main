name: Canopy Production CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    env:
      NODE_ENV: test
      CI: 'true'
      CANOPY_ISOLATE_STORE: 'true'
      EMAIL_PROVIDER: test
      MYTHOS_SESSION_SECRET: ${{ secrets.MYTHOS_SESSION_SECRET || 'alWos/oHDcV2AkRyEt9gzvsVMg9vOeNZ1Z5Zkm+j1ls=' }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'canopy_test_jwt_secret_minimum_32_characters_for_security_spec' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://khaifxlcttjpguqzvwai.supabase.co' }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_K34duPsnsHG80Mug2TVwiA_OI1al6Ng' }}
      FOUNDER_CONSOLE_KEY: ${{ secrets.FOUNDER_CONSOLE_KEY || 'canopy_test_founder_key_secure_secret' }}
      FOUNDER_EMAILS: ${{ secrets.FOUNDER_EMAILS || 'canopy.connect.collaborate@gmail.com,aarushichatterjee27@gmail.com' }}

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 3. Install dependencies
        run: npm ci

      - name: 4. Execute Frontend Test Suite (Vitest)
        run: npm run test:frontend

      - name: 5. Execute Backend API & Security Test Suite
        run: npm run test:backend

      - name: 6. Build Client for Production (Vite)
        run: npm run build

      - name: 7. Verify Distribution Assets
        run: |
          test -d dist
          test -f dist/index.html
          test -f dist/login.html
          test -f dist/match.html
          test -f dist/sprint.html
          test -f dist/notebook.html
          echo "Production build artifact verification passed."

  ci-gatekeeper:
    name: CI Gatekeeper Green Check
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Confirm all matrix suites passed
        run: echo "All frontend, backend, and build verification checks are GREEN."
