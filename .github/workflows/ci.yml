name: Canopy Production CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 3. Install dependencies
        run: npm ci

      - name: 4. Execute Frontend Test Suite (Vitest)
        run: npm run test:frontend

      - name: 5. Execute Backend API & Security Test Suite
        env:
          NODE_ENV: test
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://khaifxlcttjpguqzvwai.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'dummy_test_anon_key' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci_test_jwt_secret_key_must_be_32_characters_long' }}
        run: npm run test:backend

      - name: 6. Build Client for Production (Vite)
        run: npm run build

      - name: 7. Verify Distribution Assets
        run: |
          test -d dist
          test -f dist/index.html
          test -f dist/login.html
          test -f dist/match.html
          test -f dist/sprint.html
          test -f dist/notebook.html
          echo "Production build artifact verification passed."

  ci-gatekeeper:
    name: CI Gatekeeper Green Check
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Confirm all matrix suites passed
        run: echo "All frontend, backend, and build verification checks are GREEN."
